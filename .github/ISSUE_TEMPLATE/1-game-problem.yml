name: Game problem
description: Graphics, crashes, black screens, stutter, sound, controls or saves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Before you start:
        - **Check this repository's newest release first** (the Releases page). Every release includes all the fixes before it, and yours may already be fixed.
        - **Search the open issues.** If yours is there, add your details to it instead.
        - English, please.
        - **Never attach game files**: no hookshot.exe, image.bin, the `.bin` caches, romfs or exefs files, keys or saves.
  - type: input
    id: version
    attributes:
      label: HookshotVR version
      description: The version the launcher shows, such as `Alpha v1.0.2`.
      placeholder: Alpha v1.0.2
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - Graphics (missing, black or wrong-coloured things, lighting, flicker)
        - Crash, freeze or black screen
        - Low fps or stutter
        - Sound, controls or saves
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >-
        What you saw, and what you expected instead. For low FPS or stutter, note the FPS before and after
        and whether it happens on a second pass through the same spot. See [Low FPS or stutter](https://github.com/NotRexed/Hookshot#low-fps-or-stutter)
        for what to compare and which logs to attach.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the game
      description: The area, cutscene or menu, and what you were doing.
      placeholder: Kokiri Forest, walking out of Link's house
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once so far
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and driver version
      placeholder: RTX 3080 Ti, NVIDIA 596.21
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: CPU, RAM and operating system
      placeholder: Ryzen 7 7700, 32 GB, Windows 11
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset and controllers
      description: Leave empty if you were not in VR.
      placeholder: Rift S with its Touch controllers
  - type: dropdown
    id: runtime
    attributes:
      label: OpenXR runtime
      description: The VR app that was running (the launcher's "VR Runtime" row shows it).
      options:
        - Meta / Oculus (Quest Link, Air Link, Rift)
        - SteamVR
        - WiVRn
        - Monado
        - Virtual Desktop
        - Other (named under "What happened")
        - Not in VR
  - type: dropdown
    id: stereo
    attributes:
      label: 3D mode
      description: VR menu, General, "3D".
      options:
        - Mono
        - Stereo
        - Not in VR
  - type: dropdown
    id: view
    attributes:
      label: View
      description: VR menu, General, "View" (or the launcher's View setting).
      options:
        - First person
        - Third person
        - Window
        - Not in VR
  - type: input
    id: render_resolution
    attributes:
      label: Render resolution
      description: In the game's own menu (Insert), the "Render resolution" row, a percentage or Auto.
      placeholder: Auto, or 100%
  - type: textarea
    id: settings
    attributes:
      label: Changes from the defaults
      description: Insert-menu options you changed, and the lines in `hookshot_env.txt` if you have one. Leave empty if none.
  - type: dropdown
    id: injectors
    attributes:
      label: Other software hooked into the game
      description: ReShade, shader-cache tools (SCSKiller and the like), overlays or frame-generation injectors change what Hookshot does. Please test without them before reporting.
      options:
        - No, nothing hooked in
        - Yes (named under "Changes from the defaults")
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The launcher's logs
      description: >-
        In the launcher, Settings › Logs › Open opens the folder (Windows `%LOCALAPPDATA%\HookshotVR\logs`,
        Linux `~/.local/share/HookshotVR/logs`). Drag `last-run.log` here (add `last-run.1.log` if you started
        the game again after the problem, and `build.log` for a build problem). They have your user name and
        home folder taken out and no game files in them, so they are safe to send.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I'm on the newest release, or the problem is still there on it.
          required: true
        - label: I searched the open issues for this problem.
          required: true
        - label: I'm not attaching game files, keys, hookshot.exe, the .bin caches or saves.
          required: true
